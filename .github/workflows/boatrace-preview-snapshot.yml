name: BoatRace August Preview Snapshot
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/boatrace-preview-snapshot.yml' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout August previews
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git source
          cd source
          git sparse-checkout set data/previews/tkz/2026/08 data/previews/sui/2026/08
          git checkout
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-previews-202608
          path: |
            source/data/previews/tkz/2026/08/
            source/data/previews/sui/2026/08/
          retention-days: 1
          if-no-files-found: error
