name: BoatRace Marugame8 Screenshot Recheck 20260828
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-biwako6-20260828-temp.yml'
permissions:
  contents: read
  actions: read
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.8.0'
      - name: Restore exact frozen runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f boatrace_oos/boatrace_strength_v1_lgbm.txt boatrace_oos/history.pkl.gz
          gh run download 33138084304 -n boatrace-strength-v1-runtime-20260828 -D boatrace_oos
          sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt
      - name: Sparse checkout current source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/previews/tkz/2026/08 data/previews/sui/2026/08 data/previews/od3/2026/08
          git checkout
      - name: Run exact inference
        run: python boatrace_oos/infer_20260828_amagasaki10_temp.py
