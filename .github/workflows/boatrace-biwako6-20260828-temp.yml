name: BoatRace 20260801-0828 Venue Audit
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-biwako6-20260828-temp.yml'
permissions:
  contents: read
  actions: read
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'numba==0.61.2' 'scikit-learn==1.8.0' requests
      - name: Rebuild exact frozen runtime
        run: |
          sed -i 's/max_workers=4/max_workers=32/' boatrace_oos/bootstrap_frozen.py
          python boatrace_oos/bootstrap_frozen.py
          sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt
      - name: Sparse checkout source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/previews/tkz/2025 data/previews/sui/2025 data/previews/tkz/2026/08 data/previews/sui/2026/08
          git checkout
      - name: Run Aug venue audit
        run: python boatrace_oos/audit_20260801_0828_venue.py
