name: Check Turnmark May-Jun 2026 odds
on:
  push:
    branches: [ boatrace-infer-runner ]
    paths:
      - '.github/workflows/boatrace-eval-20260831.yml'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --quiet requests pandas
      - name: Check 2026-05-01 through 2026-06-30
        run: |
          python - <<'PY'
          import requests, pandas as pd
          from datetime import date, timedelta
          rows=[]
          d=date(2026,5,1); end=date(2026,6,30)
          while d<=end:
              ds=d.strftime('%Y%m%d')
              url=f'https://turnmark.github.io/api/v1/2026/{ds}.json'
              try:
                  r=requests.get(url,timeout=30)
                  status=r.status_code
                  if status!=200:
                      rows.append(dict(date=str(d),status=status,races=0,full120=0,partial=0,zero=0,min_filled=None,max_filled=None,total_filled=0))
                      d+=timedelta(days=1); continue
                  j=r.json()
                  race_counts=[]
                  for st in (j.get('programs',{}).get('stadiums',{}) or {}).values():
                      for race in (st.get('races',{}) or {}).values():
                          tri=((race.get('odds') or {}).get('trifecta'))
                          n=0
                          if isinstance(tri,dict):
                              for a in tri.values():
                                  if not isinstance(a,dict): continue
                                  for b in a.values():
                                      if not isinstance(b,dict): continue
                                      for v in b.values():
                                          if v is not None: n+=1
                          race_counts.append(n)
                  rows.append(dict(
                      date=str(d),status=status,races=len(race_counts),
                      full120=sum(n==120 for n in race_counts),
                      partial=sum(0<n<120 for n in race_counts),
                      zero=sum(n==0 for n in race_counts),
                      min_filled=min(race_counts) if race_counts else None,
                      max_filled=max(race_counts) if race_counts else None,
                      total_filled=sum(race_counts)
                  ))
              except Exception as e:
                  rows.append(dict(date=str(d),status='ERR',races=0,full120=0,partial=0,zero=0,min_filled=None,max_filled=None,total_filled=0,error=repr(e)))
              d+=timedelta(days=1)
          df=pd.DataFrame(rows)
          df.to_csv('turnmark_20260501_0630_coverage.csv',index=False)
          ok=df[df.status.astype(str)=='200']
          print('DAYS',len(df),'HTTP200',len(ok),'NON200',len(df)-len(ok))
          print('RACES',int(ok.races.sum()),'FULL120',int(ok.full120.sum()),'PARTIAL',int(ok.partial.sum()),'ZERO',int(ok.zero.sum()))
          print('MIN_FILLED_PER_DAY',ok.min_filled.min(),'MAX_FILLED_PER_DAY',ok.max_filled.max())
          print('TOTAL_NON_NULL_TRIFECTA',int(ok.total_filled.sum()))
          print('MAY_HTTP200',int(((df.date.str[:7]=='2026-05') & (df.status.astype(str)=='200')).sum()))
          print('JUNE_HTTP200',int(((df.date.str[:7]=='2026-06') & (df.status.astype(str)=='200')).sum()))
          print('DAYS_WITH_PARTIAL',','.join(ok.loc[ok.partial>0,'date'].tolist()))
          print('DAYS_WITH_ZERO',','.join(ok.loc[ok.zero>0,'date'].tolist()))
          print(df.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turnmark-20260501-0630-coverage
          path: turnmark_20260501_0630_coverage.csv
          retention-days: 7
