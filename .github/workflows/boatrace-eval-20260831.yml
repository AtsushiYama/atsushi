name: Compare May-Jun Turnmark odds
on:
  push:
    branches: [ boatrace-infer-runner ]
    paths:
      - '.github/workflows/boatrace-eval-20260831.yml'
permissions:
  contents: read
  actions: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' boatrace-lzh requests
      - name: Restore frozen Strength-v1.0 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33593445777 -n boatrace-strength-v1-runtime-20260902 -D boatrace_oos
          test "$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')" = "334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0"
      - name: Checkout source data
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/results/payouts/2026 data/previews/tkz/2025 data/previews/sui/2025 data/previews/tkz/2026 data/previews/sui/2026
          git checkout
      - name: Run May-Jun comparison
        run: python boatrace_oos/audit_turnmark_20260501_0630.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-turnmark-20260501-0630
          path: |
            audit_turnmark_20260501_0630_summary.csv
            audit_turnmark_20260501_0630_detail.csv
          retention-days: 7
