name: BoatRace Evaluate 20260831
on:
  push:
    branches: [ boatrace-infer-runner ]
    paths:
      - 'boatrace_oos/final_odds_filter_20260831.py'
      - '.github/workflows/boatrace-eval-20260831.yml'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas requests
      - run: python boatrace_oos/final_odds_filter_20260831.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-odds-20260831
          path: final_odds_20260831.csv
          retention-days: 7
