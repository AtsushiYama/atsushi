name: BoatRace Official Preday Scrape

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-official-preday.yml'
      - 'boatrace_oos/scrape_official_preday.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --quiet boatrace-lzh pandas
      - name: Parse official B file for 2026-08-27
        run: python boatrace_oos/scrape_official_preday.py
      - name: Upload cards
        uses: actions/upload-artifact@v4
        with:
          name: official-preday-20260827
          path: official_preday_20260827.csv
          retention-days: 1
          if-no-files-found: error
