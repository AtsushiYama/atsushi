name: Audit Daily 20260801-0830 Frozen v1 Fast
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/audit-daily-20260801-0830-fast.yml'
      - 'boatrace_oos/audit_daily_20260801_0830_fast.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' boatrace-lzh
      - name: Restore frozen runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33301553910 -n boatrace-strength-v1-runtime-20260830 -D boatrace_oos
          test "$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')" = "334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0"
      - name: Sparse checkout source data
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/previews/tkz/2025 data/previews/sui/2025 data/previews/tkz/2026/08 data/previews/sui/2026/08 data/previews/od3/2026/08 data/results/realtime/2026 data/results/payouts/2026/08
          git checkout
      - name: Audit daily ROI Aug 1-30 exact early stop
        run: python boatrace_oos/audit_daily_20260801_0830_fast.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: audit-daily-20260801-0830-fast
          path: |
            audit_daily_20260801_0830_summary.csv
            audit_daily_20260801_0830_detail.csv
          retention-days: 3
