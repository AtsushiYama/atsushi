name: Infer Kiryu6 20260830 Frozen v1
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/infer-kiryu6-20260830.yml'
      - 'boatrace_oos/infer_20260830_kiryu6.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.8.0' boatrace-lzh requests numba
      - name: Rebuild exact frozen runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          sed -i 's/ThreadPoolExecutor(max_workers=4)/ThreadPoolExecutor(max_workers=16)/' boatrace_oos/bootstrap_frozen.py
          python boatrace_oos/bootstrap_frozen.py
          test "$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')" = "334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0"
      - name: Sparse checkout source data
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/previews/tkz/2026 data/previews/sui/2026
          git checkout
      - name: Infer Kiryu 6R
        run: python boatrace_oos/infer_20260830_kiryu6.py
