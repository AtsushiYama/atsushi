name: BoatRace Common Infer Runner
on:
  push:
    branches: [ boatrace-infer-runner ]
    paths:
      - 'boatrace_oos/infer_current.py'
permissions:
  actions: read
  contents: read
jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0'
      - name: Restore frozen runtime
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh run download 33301553910 -n boatrace-strength-v1-runtime-20260830 -D boatrace_oos
          test "$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')" = "334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0"
      - name: Checkout source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026
          git checkout
      - name: Infer current race
        run: python boatrace_oos/infer_current.py
