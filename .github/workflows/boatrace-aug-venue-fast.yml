name: BoatRace Aug Venue Fast Audit
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-aug-venue-fast.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'numba==0.61.2' 'scikit-learn==1.8.0' requests
      - name: Rebuild frozen runtime
        run: |
          sed -i 's/max_workers=4/max_workers=32/' boatrace_oos/bootstrap_frozen.py
          python boatrace_oos/bootstrap_frozen.py
      - name: Checkout source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/results/payouts/2026 data/previews/tkz/2026/08 data/previews/sui/2026/08 data/previews/od3/2026/08
          git checkout
      - name: Run fast venue audit
        run: python boatrace_oos/audit_20260801_0828_venue_fast.py
      # odds3 ROI rerun
