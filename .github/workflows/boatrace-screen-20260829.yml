name: BoatRace 20260829 Preday Screen
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-screen-20260829.yml'
      - 'boatrace_oos/screen_20260829.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.8.0' boatrace-lzh
      - name: Restore exact frozen runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33138084304 -n boatrace-strength-v1-runtime-20260828 -D boatrace_oos
          sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt
      - name: Sparse checkout source data
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026 data/previews/tkz/2025 data/previews/sui/2025
          git checkout
      - name: Screen 8/29 with 8/28 regression gate
        run: python boatrace_oos/screen_20260829.py
      - name: Upload screen result
        uses: actions/upload-artifact@v4
        with:
          name: screen-20260829
          path: screen_20260829.csv
          retention-days: 2
