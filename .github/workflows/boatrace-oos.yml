name: BoatRace OOS Validation

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-oos.yml'
      - 'boatrace_oos/assets/READY'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Key bootstrap
        id: keybootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f boatrace_oos/assets/READY ]; then
            mkdir -p boatrace_oos/keytmp
            openssl req -x509 -newkey rsa:3072 -nodes \
              -keyout boatrace_oos/keytmp/private.pem \
              -out boatrace_oos/keytmp/cert.pem \
              -subj '/CN=BoatRace-OOS-Ephemeral' -days 1 >/dev/null 2>&1
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
            echo '-----BEGIN OOS CERTIFICATE BASE64-----'
            base64 -w0 boatrace_oos/keytmp/cert.pem
            echo
            echo '-----END OOS CERTIFICATE BASE64-----'
          else
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve private key as short-lived artifact
        if: steps.keybootstrap.outputs.bootstrap == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-oos-private-key
          path: boatrace_oos/keytmp/private.pem
          retention-days: 1
          if-no-files-found: error

      - name: Recover ephemeral private key
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boatrace_oos/keytmp
          aid=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=boatrace-oos-private-key&per_page=100" \
            | jq -r '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          test -n "$aid"
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
            -o boatrace_oos/keytmp/key.zip
          unzip -q boatrace_oos/keytmp/key.zip -d boatrace_oos/keytmp
          test -s boatrace_oos/keytmp/private.pem

      - name: Reassemble, decrypt, and verify frozen bundle
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -s boatrace_oos/payload/cert.pem
          cat boatrace_oos/payload/part_* | base64 -d > boatrace_oos/payload/bundle.cms
          openssl cms -decrypt -binary -inform DER \
            -in boatrace_oos/payload/bundle.cms \
            -recip boatrace_oos/payload/cert.pem \
            -inkey boatrace_oos/keytmp/private.pem \
            -out boatrace_oos/payload/bundle.tar
          tar -xf boatrace_oos/payload/bundle.tar -C boatrace_oos
          gunzip -c boatrace_oos/model.txt.gz > boatrace_oos/boatrace_strength_v1_lgbm.txt
          actual=$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')
          expected='334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0'
          echo "model_sha256=$actual"
          test "$actual" = "$expected"
          test -s boatrace_oos/history.pkl.gz
          test -s boatrace_oos/run_oos.py

      - name: Install analysis dependencies
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        run: python -m pip install --quiet --disable-pip-version-check 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0'

      - name: Sparse checkout public 2026 CSV data
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set \
            data/programs/race_cards/2026 \
            data/previews/tkz/2026/08 \
            data/previews/sui/2026/08 \
            data/previews/od3/2026/08 \
            data/results/realtime/2026 \
            data/results/payouts/2026/08
          git checkout

      - name: Run frozen OOS validation
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        run: python boatrace_oos/run_oos.py

      - name: Print aggregate report
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        run: cat boatrace_oos/output/REPORT.md

      - name: Preserve detailed OOS output privately
        if: steps.keybootstrap.outputs.bootstrap == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-oos-results-20260801-0823
          path: boatrace_oos/output/
          retention-days: 7
          if-no-files-found: error
