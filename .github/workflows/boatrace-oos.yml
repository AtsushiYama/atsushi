name: BoatRace OOS Validation

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/boatrace-oos.yml'
      - 'boatrace_oos/bootstrap_frozen.py'
      - 'boatrace_oos/run_oos.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LZH and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --quiet --disable-pip-version-check \
            'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'numba==0.61.2' requests

      - name: Rebuild frozen model from official 2023-2025 K results
        run: python boatrace_oos/bootstrap_frozen.py

      - name: Verify frozen model gate
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum boatrace_oos/boatrace_strength_v1_lgbm.txt | awk '{print $1}')
          expected='334b3a54a482a957f50c51b40614797821ae765d221734b92b95f1d4fb96cde0'
          echo "model_sha256=$actual"
          test "$actual" = "$expected"
          test -s boatrace_oos/history.pkl.gz

      - name: Sparse checkout public 2026 CSV data
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set \
            data/programs/race_cards/2026 \
            data/previews/tkz/2026/08 \
            data/previews/sui/2026/08 \
            data/previews/od3/2026/08 \
            data/results/realtime/2026 \
            data/results/payouts/2026/08
          git checkout

      - name: Patch reporting-only fixes
        shell: bash
        run: |
          python - <<'PY'
          p='boatrace_oos/run_oos.py'
          s=open(p,encoding='utf-8').read()
          s=s.replace("rows=[type('R',(),{'date':r.date,'stake':r.stake,'ret':r.ret}) for r in x.itertuples()]", "rows=[{'date':r.date,'stake':r.stake,'ret':r.ret} for r in x.itertuples()]")
          s=s.replace("('3.5<=combined<4.0',(ev.combined_odds>=3.5)&(ev.combined_odds<4.0)),", "('3.5<=combined<4.0',(ev.combined_odds>=3.5)&(ev.combined_odds<4.0)),('3.0<=combined<4.0',(ev.combined_odds>=3.0)&(ev.combined_odds<4.0)),")
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Run frozen 2026 OOS validation
        run: python boatrace_oos/run_oos.py

      - name: Print aggregate report
        run: |
          cat boatrace_oos/output/REPORT.md
          echo '--- RESULT JSON ---'
          cat boatrace_oos/output/result.json

      - name: Preserve detailed OOS output privately
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-oos-results-20260801-0823
          path: boatrace_oos/output/
          retention-days: 7
          if-no-files-found: error
