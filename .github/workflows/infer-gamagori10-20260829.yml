name: Infer Gamagori10 20260829
on: push
permissions: {actions: read, contents: read}
jobs:
  infer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet 'pandas==2.2.3' 'numpy==2.2.6' 'lightgbm==4.6.0' 'scikit-learn==1.8.0' boatrace-lzh
      - name: Restore exact runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 33237630658 -n boatrace-strength-v1-runtime-20260828 -D boatrace_oos
      - name: Checkout source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BoatraceCSV/boatracecsv.github.io.git boatrace_oos/source
          cd boatrace_oos/source
          git sparse-checkout set data/programs/race_cards/2026 data/results/realtime/2026
          git checkout
      - name: Infer
        run: python boatrace_oos/infer_gamagori10_20260829.py
